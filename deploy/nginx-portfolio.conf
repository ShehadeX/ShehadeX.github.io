# 肖致浩 · AI Engineering Desk — 个人作品集
# 访问方式：http://47.114.90.122:5000
#
# 端口说明：
#   5000 — 主端口。阿里云对未备案域名的 80/443 做 ICP 拦截，
#          5000 不在拦截范围内，作为访问入口。
#   不绑定域名，避免依赖未备案域名。

server {
    listen 5000;
    listen [::]:5000;
    server_name _;

    root /www/portfolio;
    index index.html;
    charset utf-8;

    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/portfolio-access.log;
    error_log  /var/log/nginx/portfolio-error.log;

    # 带 hash 的构建产物：长期缓存
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 图片：长期缓存
    location ^~ /img/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /paper/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA 回退：深链接（/project/bidos 等）必须能命中。
    # $uri/index.html 必须排在 $uri/ 之前，否则命中目录会触发 301 加斜杠跳转。
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # index.html 不缓存，保证发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
